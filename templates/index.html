<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda por N° de Cédula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-red: #8e0000;
            --bright-red: #ff3344;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --card-glass: rgba(255, 255, 255, 0.95);
            --shadow-3d: 0 15px 35px rgba(211, 47, 47, 0.2), 0 5px 15px rgba(0, 0, 0, 0.1);
            --inset-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f4f6fb;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        /* FONDO ILUMINADO ROJO - MÁS VISIBLE Y MENOS TRANSPARENTE */
        .ambient-light {
            position: fixed;
            top: -20%;
            left: -30%;
            width: 160%;
            height: 140%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, rgba(255, 30, 50, 0.65) 0%, transparent 55%),
                        radial-gradient(circle at 70% 60%, rgba(0, 80, 255, 0.35) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(220, 20, 40, 0.5) 0%, transparent 55%);
            filter: blur(50px);
            animation: moveLight 4s ease-in-out infinite alternate;
        }

        @keyframes moveLight {
            0% { transform: translateX(-5%) translateY(-3%) scale(1); }
            100% { transform: translateX(5%) translateY(3%) scale(1.08); }
        }

        /* LOGOS 10% MÁS GRANDES (165px) CON RUTA DINÁMICA DE FLASK */
        .header-logo-left {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            height: 165px;
            width: auto;
            z-index: 10;
            object-fit: contain;
            display: block !important;
        }

        .header-logo-right {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            height: 165px;
            width: auto;
            z-index: 10;
            object-fit: contain;
            display: block !important;
        }

        /* CENTRADO PERFECTO EN EL MEDIO DE LA PANTALLA */
        main {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card-3d {
            width: 100%;
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--shadow-3d);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .search-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-red);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .search-form {
            display: flex;
            gap: 0.8rem;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-3d {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: var(--inset-shadow);
            outline: none;
            transition: all 0.3s ease;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .input-3d:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.2);
        }

        .btn-3d {
            background: linear-gradient(135deg, var(--bright-red), var(--dark-red));
            color: white;
            border: none;
            padding: 0.85rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.4);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 1.5rem;
            color: var(--dark-red);
            font-weight: 600;
            width: 100%;
        }

        .spinner-3d {
            width: 38px;
            height: 38px;
            border: 4px solid rgba(211, 47, 47, 0.15);
            border-top: 4px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.6rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            display: none;
            width: 100%;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            background: #ffebee;
            color: #c62828;
            border-left: 5px solid #d32f2f;
            box-shadow: var(--shadow-3d);
        }

        .results-wrapper {
            width: 100%;
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .result-card-3d {
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border-radius: 18px;
            overflow: hidden;
            box-shadow: var(--shadow-3d);
            border: 1px solid rgba(255, 255, 255, 0.9);
        }

        .card-header-3d {
            padding: 1rem 1.4rem;
            font-weight: 800;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .card-header-3d.success {
            background: rgba(46, 125, 50, 0.1);
            color: #1b5e20;
            border-bottom: 2px solid #2e7d32;
        }

        .card-header-3d.warning {
            background: rgba(245, 127, 23, 0.1);
            color: #e65100;
            border-bottom: 2px solid #f57f17;
        }

        .card-body-3d {
            padding: 1.4rem;
        }

        .data-grid-3d {
            display: grid;
            grid-template-columns: 1fr;
            gap: 0.8rem;
        }

        .data-box {
            background: #ffffff;
            padding: 0.7rem 0.9rem;
            border-radius: 10px;
            border: 1px solid #f0f0f0;
        }

        .data-label {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 0.15rem;
            display: block;
        }

        .data-value {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .highlight-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .highlight-card {
            background: linear-gradient(145deg, #ffffff, #fff5f5);
            border-radius: 12px;
            padding: 1rem;
            text-align: center;
            box-shadow: var(--inset-shadow);
            border: 1px solid rgba(211, 47, 47, 0.2);
        }

        .highlight-card .data-label {
            color: var(--dark-red);
            font-size: 0.8rem;
        }

        .highlight-card .data-value {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-red);
        }

        .table-container {
            overflow-x: auto;
            border-radius: 8px;
        }

        .table-3d {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            background: #ffffff;
        }

        .table-3d th, .table-3d td {
            padding: 0.7rem 0.8rem;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .table-3d th {
            background: #fdf2f2;
            color: var(--dark-red);
            font-weight: 800;
            font-size: 0.7rem;
            text-transform: uppercase;
        }

        footer {
            position: relative;
            z-index: 2;
            background: #ffffff;
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: auto;
            border-top: 1px solid #e5e7eb;
        }

        @media (max-width: 768px) {
            .header-logo-left { top: 0.8rem; left: 0.8rem; height: 110px; }
            .header-logo-right { top: 0.8rem; right: 0.8rem; height: 110px; }
            main { padding-top: 7rem; }
            .search-form { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <!-- RUTAS COMPATIBLES CON GITHUB Y PRODUCCIÓN (CARPETA STATIC) -->
    <img src="{{ url_for('static', filename='logo-left.png') }}" alt="Logo Izquierda" class="header-logo-left" onerror="this.style.display='none'">
    <img src="{{ url_for('static', filename='logo-right.png') }}" alt="Logo Derecha" class="header-logo-right" onerror="this.style.display='none'">

    <main>
        <section class="card-3d">
            <div class="search-title">
                <i class="fa-solid fa-address-card"></i>
                <span>Búsqueda por N° de Cédula</span>
            </div>
            <form class="search-form" id="searchForm" onsubmit="realizarConsulta(event)">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="cedulaInput" class="input-3d" placeholder="N° Cédula" maxlength="9" required autocomplete="off">
                </div>
                <button type="submit" class="btn-3d">
                    <i class="fa-solid fa-search"></i> Consultar
                </button>
            </form>
        </section>

        <div id="loader" class="loader">
            <div class="spinner-3d"></div>
            <p>Consultando base de datos...</p>
        </div>

        <div id="alertError" class="alert"></div>

        <div id="resultsContainer" class="results-wrapper"></div>
    </main>

    <footer>
        Desarrollado por AJBO Multimedios
    </footer>

    <script>
        async function realizarConsulta(event) {
            event.preventDefault();
            
            const cedula = document.getElementById('cedulaInput').value.trim();
            const loader = document.getElementById('loader');
            const alertError = document.getElementById('alertError');
            const resultsContainer = document.getElementById('resultsContainer');

            alertError.style.display = 'none';
            resultsContainer.innerHTML = '';
            
            if (!cedula) return;

            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/consultar?cedula=${encodeURIComponent(cedula)}`);
                
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Error en el servidor (${response.status}): ${text}`);
                }

                const data = await response.json();
                loader.style.display = 'none';

                if (!data.habilitado && (!data.historico || data.historico.length === 0)) {
                    alertError.textContent = 'No se encontraron registros coincidentes con el número de cédula ingresado.';
                    alertError.style.display = 'block';
                    return;
                }

                if (data.habilitado) {
                    const h = data.habilitado;
                    resultsContainer.innerHTML += `
                        <div class="result-card-3d">
                            <div class="card-header-3d success">
                                <i class="fa-solid fa-circle-check"></i> HABILITADO EN RCP
                            </div>
                            <div class="card-body-3d">
                                <div class="data-grid-3d">
                                    <div class="data-box"><span class="data-label">Cédula</span><span class="data-value">${h.cedula}</span></div>
                                    <div class="data-box"><span class="data-label">Nombre Completo</span><span class="data-value">${h.nombre_completo}</span></div>
                                    <div class="data-box"><span class="data-label">Nacionalidad / Sexo</span><span class="data-value">${h.nacionalidad} (${h.sexo})</span></div>
                                    <div class="data-box"><span class="data-label">Fecha Nacimiento</span><span class="data-value">${h.fec_nac || 'N/A'}</span></div>
                                    <div class="data-box"><span class="data-label">Departamento</span><span class="data-value">${h.departamento}</span></div>
                                    <div class="data-box"><span class="data-label">Distrito</span><span class="data-value">${h.distrito}</span></div>
                                    <div class="data-box"><span class="data-label">Zona / Local</span><span class="data-value">${h.local}</span></div>
                                    <div class="data-box"><span class="data-label">Tipo Voto</span><span class="data-value">${h.tipo_voto}</span></div>
                                </div>

                                <div class="highlight-container">
                                    <div class="highlight-card">
                                        <span class="data-label">MESA</span>
                                        <div class="data-value">${h.mesa}</div>
                                    </div>
                                    <div class="highlight-card">
                                        <span class="data-label">ORDEN</span>
                                        <div class="data-value">${h.orden}</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (data.historico && data.historico.length > 0) {
                    let filasTabla = data.historico.map(i => `
                        <tr>
                            <td><strong>${i.motivo}</strong><br><small style="color:var(--text-muted);">${i.detalle}</small></td>
                            <td>${i.fecha_inscr}</td>
                            <td>${i.distrito}</td>
                            <td>${i.local}</td>
                            <td>${i.tipo_inscr}</td>
                            <td>Tal: ${i.talonario} / Bol: ${i.boleta}</td>
                        </tr>
                    `).join('');

                    resultsContainer.innerHTML += `
                        <div class="result-card-3d">
                            <div class="card-header-3d warning">
                                <i class="fa-solid fa-clock-rotate-left"></i> REGISTROS HISTÓRICOS
                            </div>
                            <div class="card-body-3d">
                                <div class="table-container">
                                    <table class="table-3d">
                                        <thead>
                                            <tr>
                                                <th>Motivo / Detalle</th>
                                                <th>Fecha</th>
                                                <th>Distrito</th>
                                                <th>Local</th>
                                                <th>Tipo</th>
                                                <th>Comprobante</th>
                                            </tr>
                                        </thead>
                                        <tbody>${filasTabla}</tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                loader.style.display = 'none';
                alertError.textContent = err.message || 'Error al conectar con la API.';
                alertError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
