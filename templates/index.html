<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Búsqueda por N° de Cédula</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-red: #d32f2f;
            --dark-red: #8e0000;
            --bright-red: #ff3344;
            --text-dark: #1f2937;
            --text-muted: #6b7280;
            --card-glass: rgba(255, 255, 255, 0.95);
            --shadow-3d: 0 15px 35px rgba(211, 47, 47, 0.2), 0 5px 15px rgba(0, 0, 0, 0.1);
            --inset-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #f4f6fb;
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        .ambient-light {
            position: fixed;
            top: -20%;
            left: -30%;
            width: 160%;
            height: 140%;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 30% 30%, rgba(255, 30, 50, 0.65) 0%, transparent 55%),
                        radial-gradient(circle at 70% 60%, rgba(0, 80, 255, 0.35) 0%, transparent 50%),
                        radial-gradient(circle at 50% 80%, rgba(220, 20, 40, 0.5) 0%, transparent 55%);
            filter: blur(50px);
            animation: moveLight 4s ease-in-out infinite alternate;
        }

        @keyframes moveLight {
            0% { transform: translateX(-5%) translateY(-3%) scale(1); }
            100% { transform: translateX(5%) translateY(3%) scale(1.08); }
        }

        .header-logo-left {
            position: absolute;
            top: 1.5rem;
            left: 2rem;
            height: 165px;
            width: auto;
            z-index: 10;
            object-fit: contain;
            display: block !important;
        }

        .header-logo-right {
            position: absolute;
            top: 1.5rem;
            right: 2rem;
            height: 165px;
            width: auto;
            z-index: 10;
            object-fit: contain;
            display: block !important;
        }

        main {
            position: relative;
            z-index: 2;
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .card-3d {
            width: 100%;
            max-width: 500px;
            background: var(--card-glass);
            backdrop-filter: blur(16px);
            border-radius: 20px;
            padding: 1.8rem;
            box-shadow: var(--shadow-3d);
            border: 1px solid rgba(255, 255, 255, 0.9);
            margin-bottom: 1.5rem;
        }

        .search-title {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--dark-red);
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
        }

        .search-form {
            display: flex;
            gap: 0.8rem;
        }

        .input-wrapper {
            position: relative;
            flex: 1;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        .input-3d {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.6rem;
            font-size: 1.1rem;
            font-weight: 600;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            background: #ffffff;
            box-shadow: var(--inset-shadow);
            outline: none;
            transition: all 0.3s ease;
            color: var(--text-dark);
            letter-spacing: 0.5px;
        }

        .input-3d:focus {
            border-color: var(--primary-red);
            box-shadow: 0 0 10px rgba(211, 47, 47, 0.2);
        }

        .btn-3d {
            background: linear-gradient(135deg, var(--bright-red), var(--dark-red));
            color: white;
            border: none;
            padding: 0.85rem 1.4rem;
            font-size: 0.95rem;
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(211, 47, 47, 0.3);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .btn-3d:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(211, 47, 47, 0.4);
        }

        .loader {
            display: none;
            text-align: center;
            padding: 1.5rem;
            color: var(--dark-red);
            font-weight: 600;
            width: 100%;
        }

        .spinner-3d {
            width: 38px;
            height: 38px;
            border: 4px solid rgba(211, 47, 47, 0.15);
            border-top: 4px solid var(--primary-red);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 0.6rem;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .alert {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 1rem 1.2rem;
            border-radius: 12px;
            margin-top: 1.5rem;
            font-weight: 600;
            font-size: 0.9rem;
            background: #ffebee;
            color: #c62828;
            border-left: 5px solid #d32f2f;
            box-shadow: var(--shadow-3d);
        }

        .results-wrapper {
            width: 100%;
            margin-top: 1rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        /* DISEÑO TIPO ESCRITORIO (ESTILO FORMULARIO OFICIAL RCP) */
        .rcp-form-card {
            background: #eef2f7;
            border: 3px solid #333;
            border-radius: 4px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            overflow: hidden;
            width: 100%;
            margin-bottom: 1rem;
        }

        .rcp-header {
            background: #374151;
            color: white;
            text-align: center;
            padding: 0.6rem;
            font-weight: 800;
            font-size: 1.05rem;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .rcp-header.success { background: #1f2937; border-bottom: 2px solid #111; }
        .rcp-header.warning { background: #374151; border-bottom: 2px solid #111; }

        .rcp-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        /* FILAS Y BLOQUES DE DATOS ESTILO FORMULARIO */
        .rcp-row {
            display: grid;
            grid-template-columns: 140px 1fr 140px 160px;
            gap: 6px;
            align-items: center;
        }

        .rcp-row.two-cols {
            grid-template-columns: 140px 1fr;
        }

        .rcp-row.three-cols {
            grid-template-columns: 140px 1fr 120px 80px;
        }

        .rcp-row.meta-row {
            grid-template-columns: 1fr 1fr;
            justify-content: center;
            max-width: 500px;
            margin: 4px auto;
        }

        .rcp-label {
            background: #d1d5db;
            color: #111;
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            border-radius: 2px;
            text-transform: uppercase;
            height: 100%;
            display: flex;
            align-items: center;
        }

        .rcp-value {
            background: #ffffff;
            color: #111;
            padding: 6px 10px;
            font-size: 0.85rem;
            font-weight: 700;
            border: 1px solid #cbd5e1;
            border-radius: 2px;
            min-height: 28px;
            display: flex;
            align-items: center;
        }

        .rcp-sub-banner {
            background: #cbd5e1;
            color: #111;
            text-align: center;
            font-weight: 800;
            font-size: 0.85rem;
            padding: 5px;
            border: 1px solid #94a3b8;
            text-transform: uppercase;
            margin: 4px 0;
        }

        /* TABLA HISTÓRICA PROFESIONAL */
        .table-container {
            overflow-x: auto;
            background: white;
            border: 1px solid #cbd5e1;
            margin-top: 5px;
        }

        .table-rcp {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
        }

        .table-rcp th {
            background: #1f2937;
            color: white;
            padding: 6px 8px;
            text-align: left;
            font-size: 0.75rem;
            text-transform: uppercase;
        }

        .table-rcp td {
            padding: 6px 8px;
            border-bottom: 1px solid #e2e8f0;
            color: #1f2937;
            font-weight: 600;
        }

        footer {
            position: relative;
            z-index: 2;
            background: #ffffff;
            color: var(--text-muted);
            text-align: center;
            padding: 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: auto;
            border-top: 1px solid #e5e7eb;
        }

        /* ADAPTACIÓN MÓVIL (SE CONVIERTE EN BLOQUES VERTICALES LIMPIOS) */
        @media (max-width: 768px) {
            .header-logo-left { top: 0.8rem; left: 0.8rem; height: 110px; }
            .header-logo-right { top: 0.8rem; right: 0.8rem; height: 110px; }
            main { padding-top: 7rem; }
            .search-form { flex-direction: column; }
            
            .rcp-row, .rcp-row.two-cols, .rcp-row.three-cols, .rcp-row.meta-row {
                grid-template-columns: 1fr !important;
                gap: 3px;
            }
            .rcp-label { border-radius: 2px 2px 0 0; }
            .rcp-value { border-radius: 0 0 2px 2px; }
        }
    </style>
</head>
<body>

    <div class="ambient-light"></div>

    <img src="{{ url_for('static', filename='logo-left.png') }}" alt="Logo Izquierda" class="header-logo-left" onerror="this.style.display='none'">
    <img src="{{ url_for('static', filename='logo-right.png') }}" alt="Logo Derecha" class="header-logo-right" onerror="this.style.display='none'">

    <main>
        <section class="card-3d">
            <div class="search-title">
                <i class="fa-solid fa-address-card"></i>
                <span>Búsqueda por N° de Cédula</span>
            </div>
            <form class="search-form" id="searchForm" onsubmit="realizarConsulta(event)">
                <div class="input-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="cedulaInput" class="input-3d" placeholder="N° Cédula" maxlength="9" required autocomplete="off">
                </div>
                <button type="submit" class="btn-3d">
                    <i class="fa-solid fa-search"></i> Consultar
                </button>
            </form>
        </section>

        <div id="loader" class="loader">
            <div class="spinner-3d"></div>
            <p>Consultando base de datos...</p>
        </div>

        <div id="alertError" class="alert"></div>

        <div id="resultsContainer" class="results-wrapper"></div>
    </main>

    <footer>
        Desarrollado por AJBO Multimedios
    </footer>

    <script>
        async function realizarConsulta(event) {
            event.preventDefault();
            
            const cedula = document.getElementById('cedulaInput').value.trim();
            const loader = document.getElementById('loader');
            const alertError = document.getElementById('alertError');
            const resultsContainer = document.getElementById('resultsContainer');

            alertError.style.display = 'none';
            resultsContainer.innerHTML = '';
            
            if (!cedula) return;

            loader.style.display = 'block';

            try {
                const response = await fetch(`/api/consultar?cedula=${encodeURIComponent(cedula)}`);
                
                if (!response.ok) {
                    const text = await response.text();
                    throw new Error(`Error en el servidor (${response.status}): ${text}`);
                }

                const data = await response.json();
                loader.style.display = 'none';

                if (!data.habilitado && (!data.historico || data.historico.length === 0)) {
                    alertError.textContent = 'No se encontraron registros coincidentes con el número de cédula ingresado.';
                    alertError.style.display = 'block';
                    return;
                }

                if (data.habilitado) {
                    const h = data.habilitado;
                    resultsContainer.innerHTML += `
                        <div class="rcp-form-card">
                            <div class="rcp-header success">
                                <i class="fa-solid fa-circle-check"></i> INSCRIPCIONES HABILITADAS EN RCP
                            </div>
                            <div class="rcp-body">
                                <div class="rcp-row">
                                    <div class="rcp-label">Nombre y Apellido</div>
                                    <div class="rcp-value">${h.nombre_completo}</div>
                                    <div class="rcp-label">Nacionalidad</div>
                                    <div class="rcp-value">${h.nacionalidad}</div>
                                </div>
                                <div class="rcp-row three-cols">
                                    <div class="rcp-label">Departamento</div>
                                    <div class="rcp-value">${h.departamento}</div>
                                    <div class="rcp-label">Fec. de Nac.</div>
                                    <div class="rcp-value">${h.fec_nac || 'N/A'}</div>
                                </div>
                                <div class="rcp-row three-cols">
                                    <div class="rcp-label">Distrito</div>
                                    <div class="rcp-value">${h.distrito}</div>
                                    <div class="rcp-label">Sexo</div>
                                    <div class="rcp-value">${h.sexo}</div>
                                </div>
                                <div class="rcp-row two-cols">
                                    <div class="rcp-label">Zona</div>
                                    <div class="rcp-value">${h.zona || 'N/A'}</div>
                                </div>
                                <div class="rcp-row two-cols">
                                    <div class="rcp-label">Local</div>
                                    <div class="rcp-value">${h.local}</div>
                                </div>
                                
                                <div class="rcp-row meta-row">
                                    <div style="display:flex; gap:6px; align-items:center;">
                                        <div class="rcp-label" style="width:70px; justify-content:center;">MESA</div>
                                        <div class="rcp-value" style="justify-content:center; flex:1;">${h.mesa}</div>
                                    </div>
                                    <div style="display:flex; gap:6px; align-items:center;">
                                        <div class="rcp-label" style="width:70px; justify-content:center;">ORDEN</div>
                                        <div class="rcp-value" style="justify-content:center; flex:1;">${h.orden}</div>
                                    </div>
                                </div>

                                <div class="rcp-sub-banner">${h.tipo_voto || 'MESA NORMAL'}</div>

                                <div class="rcp-row two-cols">
                                    <div class="rcp-label">Pueblo Indígena</div>
                                    <div class="rcp-value">${h.pueblo_indigena || 'SIN DATOS'}</div>
                                </div>
                                <div class="rcp-row two-cols">
                                    <div class="rcp-label">Comunidad Indígena</div>
                                    <div class="rcp-value">${h.comunidad_indigena || 'SIN DATOS'}</div>
                                </div>
                            </div>
                        </div>
                    `;
                }

                if (data.historico && data.historico.length > 0) {
                    let filasTabla = data.historico.map(i => `
                        <tr>
                            <td>${i.cedula || cedula}</td>
                            <td><strong>${i.nombre_completo || (data.habilitado ? data.habilitado.nombre_completo : 'N/A')}</strong></td>
                            <td><strong style="color:var(--dark-red);">${i.motivo}</strong></td>
                            <td>${i.detalle || ''}</td>
                        </tr>
                    `).join('');

                    let detallesHistoricosCards = data.historico.map(i => `
                        <div style="background: #fff; border: 1px solid #cbd5e1; padding: 10px; margin-top: 6px; border-radius: 3px;">
                            <div class="rcp-row two-cols" style="margin-bottom: 4px;">
                                <div class="rcp-label">Departamento</div>
                                <div class="rcp-value">${i.departamento || 'N/A'}</div>
                            </div>
                            <div class="rcp-row two-cols" style="margin-bottom: 4px;">
                                <div class="rcp-label">Distrito</div>
                                <div class="rcp-value">${i.distrito || 'N/A'}</div>
                            </div>
                            <div class="rcp-row two-cols" style="margin-bottom: 4px;">
                                <div class="rcp-label">Zona</div>
                                <div class="rcp-value">${i.zona || 'N/A'}</div>
                            </div>
                            <div class="rcp-row two-cols" style="margin-bottom: 4px;">
                                <div class="rcp-label">Local</div>
                                <div class="rcp-value">${i.local || 'N/A'}</div>
                            </div>
                            <div class="rcp-row two-cols" style="grid-template-columns: 1fr 1fr 1fr 1fr; gap:4px; margin-top:6px;">
                                <div style="display:flex; flex-direction:column;"><span class="rcp-label" style="font-size:0.65rem;">Fecha Inscr.</span><span class="rcp-value" style="font-size:0.8rem;">${i.fecha_inscr || ''}</span></div>
                                <div style="display:flex; flex-direction:column;"><span class="rcp-label" style="font-size:0.65rem;">Tipo Inscr.</span><span class="rcp-value" style="font-size:0.8rem;">${i.tipo_inscr || ''}</span></div>
                                <div style="display:flex; flex-direction:column;"><span class="rcp-label" style="font-size:0.65rem;">Talonario</span><span class="rcp-value" style="font-size:0.8rem;">${i.talonario || ''}</span></div>
                                <div style="display:flex; flex-direction:column;"><span class="rcp-label" style="font-size:0.65rem;">Boleta N°</span><span class="rcp-value" style="font-size:0.8rem;">${i.boleta || ''}</span></div>
                            </div>
                        </div>
                    `).join('');

                    resultsContainer.innerHTML += `
                        <div class="rcp-form-card">
                            <div class="rcp-header warning">
                                <i class="fa-solid fa-clock-rotate-left"></i> INSCRIPCIONES NO HABILITADAS - HISTÓRICO
                            </div>
                            <div class="rcp-body">
                                <div class="table-container">
                                    <table class="table-rcp">
                                        <thead>
                                            <tr>
                                                <th>N° CÉDULA</th>
                                                <th>NOMBRE y APELLIDO</th>
                                                <th>MOTIVO</th>
                                                <th>DETALLE</th>
                                            </tr>
                                        </thead>
                                        <tbody>${filasTabla}</tbody>
                                    </table>
                                </div>
                                ${detallesHistoricosCards}
                            </div>
                        </div>
                    `;
                }

            } catch (err) {
                loader.style.display = 'none';
                alertError.textContent = err.message || 'Error al conectar con la API.';
                alertError.style.display = 'block';
            }
        }
    </script>
</body>
</html>
